<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>소식지 | TU 게임그래픽전공 뉴스레터</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0a0a12; --bg-soft:#12121f; --card:#181826; --card-hi:#1f1f33; --line:#2a2a40;
    --text:#e8e8f2; --muted:#9a9ab5; --accent:#7c5cff; --accent-2:#00e5c3; --accent-3:#ff4d8d;
    --grad:linear-gradient(120deg,#7c5cff 0%,#ff4d8d 55%,#00e5c3 100%);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:900px; margin:0 auto; padding:0 22px; }

  header.nav { position:sticky; top:0; z-index:100; background:rgba(10,10,18,.82); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height:66px; }
  .brand { display:flex; align-items:center; gap:11px; font-weight:900; font-size:1.05rem; letter-spacing:-.3px; }
  .brand .logo { width:34px; height:34px; border-radius:9px; background:var(--grad); display:grid; place-items:center; font-family:'Black Han Sans'; font-size:1.1rem; color:#0a0a12; box-shadow:0 0 20px rgba(124,92,255,.45); }
  .brand small { display:block; font-size:.64rem; font-weight:500; color:var(--muted); letter-spacing:.5px; }
  .back-link { display:inline-flex; align-items:center; gap:7px; padding:8px 16px; border-radius:999px; font-size:.9rem; font-weight:700; background:var(--card); border:1px solid var(--line); transition:all .2s; }
  .back-link:hover { border-color:var(--accent); color:#fff; transform:translateX(-3px); }

  .hero { position:relative; padding:70px 0 44px; overflow:hidden; }
  .hero::before { content:""; position:absolute; inset:0; background:radial-gradient(640px 320px at 15% -10%,rgba(124,92,255,.26),transparent 60%),radial-gradient(520px 300px at 90% 0%,rgba(0,229,195,.16),transparent 60%); pointer-events:none; }
  .hero .wrap { position:relative; }
  .issue-chip { display:inline-flex; align-items:center; gap:8px; font-size:.78rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent-2); border:1px solid var(--line); background:var(--card); padding:6px 14px; border-radius:999px; }
  .hero h1 { font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:clamp(2rem,5vw,3.4rem); line-height:1.12; margin:20px 0 14px; letter-spacing:-.6px; }
  .hero .period { color:var(--muted); font-weight:700; letter-spacing:.5px; }
  .hero .pub { color:var(--accent-2); font-size:.85rem; font-weight:700; margin-top:4px; }
  .hero .intro { color:var(--text); font-size:clamp(1rem,2vw,1.18rem); max-width:680px; margin-top:16px; opacity:.92; }
  .cover-wrap { margin-top:28px; border-radius:20px; overflow:hidden; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,.45); aspect-ratio:16/9; background:var(--card); }
  .cover-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .divider { height:1px; background:var(--line); margin:8px 0 0; }

  main { padding:16px 0 40px; }
  .sect { padding:34px 0; border-bottom:1px solid var(--line); }
  .sect:last-of-type { border-bottom:0; }
  .sect h2 { font-family:'Black Han Sans'; font-weight:400; font-size:clamp(1.5rem,3.5vw,2.1rem); letter-spacing:-.4px; }
  .sect .sec-lead { color:var(--muted); margin-top:6px; margin-bottom:22px; }

  .cards { display:flex; flex-direction:column; gap:14px; }
  .card { display:flex; gap:18px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 24px; transition:all .2s; }
  .card:hover { border-color:var(--accent); background:var(--card-hi); }
  .card .bar { width:5px; align-self:stretch; border-radius:6px; background:var(--grad); flex-shrink:0; }
  .card .cat { font-size:.72rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); }
  .card h3 { font-size:1.12rem; font-weight:700; margin:4px 0 6px; }
  .card p { color:var(--muted); font-size:.95rem; }

  .pager { display:flex; gap:14px; margin-top:40px; }
  .pager a { flex:1; display:flex; flex-direction:column; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 22px; transition:all .2s; min-width:0; }
  .pager a:hover { border-color:var(--accent); background:var(--card-hi); transform:translateY(-3px); }
  .pager a.next { text-align:right; align-items:flex-end; }
  .pager a.disabled { opacity:.35; pointer-events:none; }
  .pager .dir { font-size:.74rem; font-weight:700; letter-spacing:1px; color:var(--accent-2); text-transform:uppercase; }
  .pager .ttl { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  .gallery-sect { padding:34px 0 10px; }
  .gallery-sect h2 { font-family:'Black Han Sans'; font-weight:400; font-size:clamp(1.5rem,3.5vw,2.1rem); letter-spacing:-.4px; margin-bottom:4px; }
  .gallery-sect .sec-lead { color:var(--muted); margin-bottom:22px; }
  .gallery { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .gallery figure { position:relative; margin:0; aspect-ratio:1/1; border-radius:12px; overflow:hidden; border:1px solid var(--line); cursor:pointer; background:var(--card); }
  .gallery img { width:100%; height:100%; object-fit:cover; transition:transform .35s; }
  .gallery figure:hover img { transform:scale(1.08); }
  .gallery figure::after { content:"⤢"; position:absolute; right:8px; bottom:6px; color:#fff; opacity:0; font-size:1rem; text-shadow:0 1px 4px rgba(0,0,0,.7); transition:opacity .2s; }
  .gallery figure:hover::after { opacity:.9; }
  /* lightbox */
  .lb { position:fixed; inset:0; z-index:1000; background:rgba(6,6,12,.94); display:none; align-items:center; justify-content:center; }
  .lb.open { display:flex; }
  .lb img { max-width:92vw; max-height:84vh; border-radius:10px; box-shadow:0 20px 70px rgba(0,0,0,.6); }
  .lb .x, .lb .nav { position:absolute; background:rgba(255,255,255,.08); border:1px solid var(--line); color:#fff; border-radius:999px; cursor:pointer; display:grid; place-items:center; transition:background .2s; }
  .lb .x:hover, .lb .nav:hover { background:rgba(255,255,255,.2); }
  .lb .x { top:20px; right:22px; width:44px; height:44px; font-size:1.4rem; }
  .lb .nav { top:50%; transform:translateY(-50%); width:52px; height:52px; font-size:1.8rem; }
  .lb .prev { left:20px; } .lb .next { right:20px; }
  .lb .count { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:.85rem; }
  @media (max-width:640px){ .gallery { grid-template-columns:repeat(2,1fr); } .lb .nav { width:42px; height:42px; } }

  .to-list { text-align:center; margin-top:34px; }
  .btn { display:inline-flex; align-items:center; gap:9px; padding:13px 26px; border-radius:999px; font-weight:700; font-size:.96rem; cursor:pointer; border:0; background:var(--grad); color:#0a0a12; box-shadow:0 8px 30px rgba(124,92,255,.4); transition:transform .15s; }
  .btn:hover { transform:translateY(-2px); }

  footer { border-top:1px solid var(--line); padding:40px 0; background:var(--bg-soft); color:var(--muted); font-size:.84rem; text-align:center; }

  @media (max-width:640px){ .pager { flex-direction:column; } .card { padding:18px; } }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="brand">
      <span class="logo">TU</span>
      <span>게임그래픽전공<small>TU GAME GRAPHICS · NEWSLETTER</small></span>
    </a>
    <a href="index.html#archive" class="back-link">← 목록으로</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="issue-chip" id="chip">소식지</span>
    <h1 id="title">소식지</h1>
    <div class="period" id="period"></div>
    <div class="pub" id="pub"></div>
    <p class="intro" id="intro"></p>
    <div class="cover-wrap" id="coverWrap" hidden><img id="cover" alt="" /></div>
  </div>
</section>

<main>
  <div class="wrap" id="body"></div>
  <div class="wrap gallery-sect" id="gallerySect" hidden>
    <h2>📸 포토 갤러리</h2>
    <p class="sec-lead">이 호에 실린 현장 사진입니다. 사진을 클릭하면 크게 볼 수 있습니다.</p>
    <div class="gallery" id="gallery"></div>
  </div>
  <div class="wrap">
    <div class="pager" id="pager"></div>
    <div class="to-list"><a href="index.html#archive" class="btn">📰 전체 소식지 목록으로 돌아가기</a></div>
  </div>
</main>

<footer>© 2026 동명대학교 게임학부 게임그래픽전공 Newsletter</footer>

<!-- lightbox -->
<div class="lb" id="lb">
  <button class="x" id="lbClose" aria-label="닫기">✕</button>
  <button class="nav prev" id="lbPrev" aria-label="이전">‹</button>
  <img id="lbImg" src="" alt="" />
  <button class="nav next" id="lbNext" aria-label="다음">›</button>
  <div class="count" id="lbCount"></div>
</div>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const list = window.ARCHIVE || [];
  const idx = list.findIndex(a => a.id === id);
  const item = idx >= 0 ? list[idx] : null;

  if (!item) {
    document.getElementById('title').textContent = '소식지를 찾을 수 없습니다';
    document.getElementById('intro').textContent = '요청하신 소식지가 없습니다. 목록으로 돌아가 다시 선택해 주세요.';
    document.getElementById('body').innerHTML = '';
  } else {
    document.title = item.title + ' | TU 게임그래픽전공 뉴스레터';
    document.getElementById('chip').textContent = item.issue;
    document.getElementById('title').textContent = item.title;
    document.getElementById('period').textContent = item.period || '';
    document.getElementById('pub').textContent = item.pub || '';
    document.getElementById('intro').textContent = item.intro || '';
    if (item.cover) {
      const cw = document.getElementById('coverWrap');
      document.getElementById('cover').src = item.cover;
      document.getElementById('cover').alt = item.title;
      cw.hidden = false;
    }

    const body = document.getElementById('body');
    (item.sections || []).forEach(s => {
      const sect = document.createElement('section');
      sect.className = 'sect';
      const cards = (s.items || []).map(it => `
        <div class="card">
          <div class="bar"></div>
          <div>
            <div class="cat">${it.cat || ''}</div>
            <h3>${it.title || ''}</h3>
            <p>${it.desc || ''}</p>
          </div>
        </div>`).join('');
      sect.innerHTML = `
        <h2>${s.heading || ''}</h2>
        ${s.lead ? `<p class="sec-lead">${s.lead}</p>` : ''}
        <div class="cards">${cards}</div>`;
      body.appendChild(sect);
    });

    // ---- photo gallery + lightbox ----
    const imgs = (window.GALLERY && window.GALLERY[item.id]) || [];
    if (imgs.length) {
      const gWrap = document.getElementById('gallerySect');
      const g = document.getElementById('gallery');
      imgs.forEach((src, i) => {
        const fig = document.createElement('figure');
        fig.innerHTML = `<img src="${src}" alt="${item.title} 사진 ${i + 1}" loading="lazy" />`;
        fig.addEventListener('click', () => openLb(i));
        g.appendChild(fig);
      });
      gWrap.hidden = false;

      const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'),
            lbCount = document.getElementById('lbCount');
      let cur = 0;
      const show = i => { cur = (i + imgs.length) % imgs.length; lbImg.src = imgs[cur]; lbCount.textContent = `${cur + 1} / ${imgs.length}`; };
      window.openLb = i => { show(i); lb.classList.add('open'); };
      const close = () => lb.classList.remove('open');
      document.getElementById('lbClose').addEventListener('click', close);
      document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
      document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') show(cur - 1);
        else if (e.key === 'ArrowRight') show(cur + 1);
      });
    }

    // prev / next (list is newest-first)
    const prev = list[idx - 1]; // newer
    const next = list[idx + 1]; // older
    const pager = document.getElementById('pager');
    const nav = (it, cls, dir) => it
      ? `<a class="${cls}" href="${it.external || 'newsletter.html?id=' + it.id}"${it.external ? ' target="_blank" rel="noopener"' : ''}><span class="dir">${dir}</span><span class="ttl">${it.issue}${it.external ? ' ↗' : ''}</span></a>`
      : `<a class="${cls} disabled"><span class="dir">${dir}</span><span class="ttl">없음</span></a>`;
    pager.innerHTML = nav(prev, 'prev', '← 최신 호') + nav(next, 'next', '이전 호 →');
  }
</script>
</body>
</html>
